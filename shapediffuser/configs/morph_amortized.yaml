# Amortized inverse kinematics across a CONTINUOUS FAMILY of soft arms.
#
# Every training sample is drawn from its own morphology - four segment
# lengths and four curvature gains, each independent - and the model is
# conditioned on that 8-vector alongside the target. The nominal Paper-1 arm
# (L=0.06, g=25 on every segment) sits inside the box, so it is an
# interpolation test; morphologies outside the box test extrapolation.
#
# This is dr.yaml with one change: the model is TOLD the morphology. Paper 1
# showed dr.yaml's randomize-but-hide recovers nothing under model change.
# Whether telling is what was missing is the experiment.
arm:
  n_segments: 4
  seg_length: 0.06          # nominal; generation draws per-sample from morph_ranges
  curvature_gain: 25.0      # nominal; ditto
  points_per_seg: 10
  rod_radius: 0.012

data:
  n_train: 500000
  n_val: 20000
  mode: uniform
  babble_step: 0.08
  shape_points: 8
  cond_type: tip_morph      # [tip(3), L_1..L_4, g_1..g_4] = 11-D condition
  seed: 0
  morph_ranges:
    seg_length: [0.04, 0.08]        # nominal 0.06 +/- 33%; total reach 0.16-0.32 m
    curvature_gain: [15.0, 35.0]    # nominal 25 +/- 40%

model:
  hidden: 512
  n_blocks: 6
  T: 1000
  cond_drop: 0.1
  mdn_k: 8

train:
  batch_size: 1024
  lr: 3.0e-4
  epochs: 60
  weight_decay: 1.0e-6
  device: cuda
  ckpt_dir: checkpoints_morph_amortized

eval:
  n_targets_accuracy: 512
  n_samples_per_target: 32
  ddim_steps: 20
  guidance: 1.5
  success_tol: 0.005
  n_targets_modes: 20
  mode_pool: 2000000
  dbscan_eps: 12.0
  dbscan_min_samples: 5
  mode_match_radius: 15.0
  n_obstacle_trials: 200
  n_obstacles: 3
  obstacle_radius: 0.02
