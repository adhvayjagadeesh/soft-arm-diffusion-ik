# Specialist trained on ONE held-out in-distribution arm (in_dist_0 of the
# morphology test suite). The upper bound a reviewer will ask for: does a
# model given 5e5 samples of THIS arm beat the amortized model on it?
arm:
  n_segments: 4
  seg_length:
  - 0.0451
  - 0.06
  - 0.0641
  - 0.0411
  curvature_gain:
  - 17.96
  - 33.56
  - 16.41
  - 17.6
  points_per_seg: 10
  rod_radius: 0.012
data:
  n_train: 500000
  n_val: 20000
  mode: uniform
  babble_step: 0.08
  shape_points: 8
  cond_type: tip
  seed: 0
model:
  hidden: 512
  n_blocks: 6
  T: 1000
  cond_drop: 0.1
  mdn_k: 8
train:
  batch_size: 1024
  lr: 0.0003
  epochs: 60
  weight_decay: 1.0e-06
  device: cuda
  ckpt_dir: checkpoints_specialist_indist0
eval:
  n_targets_accuracy: 512
  n_samples_per_target: 32
  ddim_steps: 20
  guidance: 1.5
  success_tol: 0.005
  n_targets_modes: 20
  mode_pool: 2000000
  dbscan_eps: 12.0
  dbscan_min_samples: 5
  mode_match_radius: 15.0
  n_obstacle_trials: 200
  n_obstacles: 3
  obstacle_radius: 0.02
