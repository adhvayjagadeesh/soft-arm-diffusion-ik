# Morphology-generalization sweep: same PCC-arm family as default.yaml,
# more segments (more actuation redundancy expected). Total arm length
# 0.36m; success_tol scaled to stay ~2% of arm length (7.2mm), consistent
# with default.yaml's 5mm/240mm convention. E2 (mode enumeration) is
# skipped for this sweep via evaluate.py --skip_modes: dbscan_eps/
# mode_match_radius were calibrated for the 4-segment arm's curvature
# scale and would need per-morphology recalibration to be trustworthy.

arm:
  n_segments: 6
  seg_length: 0.06
  curvature_gain: 25.0
  points_per_seg: 10
  rod_radius: 0.012

data:
  n_train: 500000
  n_val: 20000
  mode: uniform
  babble_step: 0.08
  shape_points: 8
  cond_type: tip
  seed: 0

model:
  hidden: 512
  n_blocks: 6
  T: 1000
  cond_drop: 0.1
  mdn_k: 8

train:
  batch_size: 1024
  lr: 3.0e-4
  epochs: 60
  weight_decay: 1.0e-6
  device: cuda
  ckpt_dir: checkpoints_morph6seg

eval:
  n_targets_accuracy: 512
  n_samples_per_target: 32
  ddim_steps: 20
  guidance: 1.5
  success_tol: 0.0072    # ~2% of 0.36m arm length
  n_targets_modes: 20
  mode_pool: 2000000
  dbscan_eps: 12.0
  dbscan_min_samples: 5
  mode_match_radius: 15.0
  n_obstacle_trials: 200
  n_obstacles: 3
  obstacle_radius: 0.02
