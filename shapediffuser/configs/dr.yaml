# Domain-randomization variant of default.yaml: training data is generated
# with curvature_gain drawn per-sample from Uniform(15, 35) instead of the
# fixed 25.0, and the model is NOT conditioned on which gain was used - the
# point is to force actuations that work reasonably well across a range of
# dynamics, not to teach the model the range itself. Everything else is
# unchanged from default.yaml, including the arm's own nominal
# curvature_gain=25.0 (used for eval/E1/transfer-study comparisons, since
# that's the "real" PCC arm we compare against - only *data generation* is
# randomized). See README's "Novelty / related work" and open-threads
# sections for why this may have limited power against the established
# structural (not just magnitude) PCC/Elastica mismatch, and why it's being
# tried anyway as a cheap, informative first test.

arm:
  n_segments: 4
  seg_length: 0.06
  curvature_gain: 25.0
  points_per_seg: 10
  rod_radius: 0.012

data:
  n_train: 500000
  n_val: 20000
  mode: uniform
  babble_step: 0.08
  shape_points: 8
  cond_type: tip
  seed: 0
  curvature_gain_range: [15.0, 35.0]

model:
  hidden: 512
  n_blocks: 6
  T: 1000
  cond_drop: 0.1
  mdn_k: 8

train:
  batch_size: 1024
  lr: 3.0e-4
  epochs: 60
  weight_decay: 1.0e-6
  device: cuda
  ckpt_dir: checkpoints_dr

eval:
  n_targets_accuracy: 512
  n_samples_per_target: 32
  ddim_steps: 20
  guidance: 1.5
  success_tol: 0.005
  n_targets_modes: 20
  mode_pool: 2000000
  dbscan_eps: 12.0
  dbscan_min_samples: 5
  mode_match_radius: 15.0
  n_obstacle_trials: 200
  n_obstacles: 3
  obstacle_radius: 0.02
